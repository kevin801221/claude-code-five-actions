name: Maintenance
on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-maintenance
  cancel-in-progress: false
jobs:
  weekly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify the guide and examples
        run: python3 scripts/check_repo.py
      - name: Observe upstream fingerprints
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/watch_sources.py --report "$RUNNER_TEMP/upstream-report.json"
      - name: Report changes once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/report_upstream.py "$RUNNER_TEMP/upstream-report.json" --repo "$GITHUB_REPOSITORY"
